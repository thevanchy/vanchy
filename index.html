<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benim Bağlantılarım | Özel Profil</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="userView" class="profile-container">
        <img id="viewAvatar" src="" alt="Avatar" class="avatar">
        <h1 id="viewName" class="name">-</h1>
        <p id="viewBio" class="bio">-</p>
        <div id="linksContainer" class="links-wrapper"></div>
        <span class="admin-trigger" onclick="openLogin()">🔒 Yönetim Paneli</span>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h3>🔒 Yetkili Girişi</h3>
            <div class="input-group">
                <label>GitHub Kişisel Erişim Tokenı (PAT)</label>
                <input type="password" id="adminPassword" placeholder="ghp_ ile başlayan token kodunuz">
                <small style="color:#94a3b8; display:block; margin-top:5px;">Verilerinizin GitHub'a kaydedilmesi için şifre olarak Token kullanmalısınız.</small>
            </div>
            <button class="btn" onclick="checkPassword()">Giriş Yap</button>
            <button class="btn btn-danger" style="margin-top:5px;" onclick="closeModal('loginModal')">İptal</button>
        </div>
    </div>

    <div id="adminView" class="admin-panel">
        <div class="admin-header">
            <h2>⚙️ Profil Kontrol Merkezi</h2>
            <button class="btn" style="width:auto; margin:0; background:#475569;" onclick="logout()">Çıkış Yap</button>
        </div>
        <div class="stats-grid">
            <div class="stat-box">Toplam Görüntülenme<span id="statTotal">0</span></div>
            <div class="stat-box">Bağlantı Sayısı<span id="statLinksCount">0</span></div>
        </div>
        <div class="section-title">1. Profil & Görünüm Ayarları</div>
        <div class="input-group"><label>Görünecek İsim</label><input type="text" id="editName"></div>
        <div class="input-group"><label>Biyografi Yazısı</label><textarea id="editBio" rows="2"></textarea></div>
        <div class="input-group"><label>Profil Resmi URL adresi</label><input type="text" id="editAvatar"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
            <div class="input-group"><label>Arka Plan (Hex/RGB)</label><input type="text" id="editBg"></div>
            <div class="input-group"><label>Buton Rengi</label><input type="text" id="editCardBg"></div>
            <div class="input-group"><label>Yazı Rengi</label><input type="text" id="editTextColor"></div>
        </div>
        <div class="section-title" style="margin-top:25px;">2. GitHub Depo Ayarları (Kalıcılık İçin)</div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="input-group"><label>GitHub Kullanıcı Adınız</label><input type="text" id="editGhUser" placeholder="Orn: ahmet123"></div>
            <div class="input-group"><label>Depo (Repository) Adınız</label><input type="text" id="editGhRepo" placeholder="Orn: link-sitem"></div>
        </div>
        <div class="section-title" style="margin-top:25px;">3. Bağlantıları Yönet</div>
        <div class="add-link-box">
            <div class="input-group"><label>Bağlantı Başlığı</label><input type="text" id="newLinkTitle"></div>
            <div class="input-group"><label>Link Adresi (URL)</label><input type="text" id="newLinkUrl" placeholder="https://..."></div>
            <div class="input-group">
                <label>İkon Seçimi</label>
                <select id="newLinkIcon">
                    <option value="fa-solid fa-link">Standart Link 🔗</option>
                    <option value="fa-brands fa-instagram">Instagram 📸</option>
                    <option value="fa-brands fa-twitter">Twitter / X 🐦</option>
                    <option value="fa-brands fa-github">GitHub 💻</option>
                    <option value="fa-brands fa-youtube">YouTube 📺</option>
                    <option value="fa-solid fa-file-pdf">Dosya / CV / Medya 📄</option>
                </select>
            </div>
            <button class="btn" style="background:#22c55e;" onclick="addLink()">Listeye Ekle</button>
        </div>
        <div id="adminLinksList"></div>
        <button class="btn btn-save" onclick="saveAllData()">💾 Değişiklikleri GitHub'a Gönder ve Yayınla</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
