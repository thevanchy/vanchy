<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim | PPF.ONE Premium</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div class="profile-container">
        <!-- Hazır ve Aktif Profil Resmi -->
        <div class="avatar-box">
            <img id="viewAvatar" src="https://unsplash.com" alt="Avatar" class="avatar">
        </div>
        
        <!-- Dinamik Rozetlerin Sıralandığı Alan -->
        <div id="badgeArea" class="badge-row"></div>
        
        <h1 id="viewName" class="name-wrapper">-</h1>
        <p id="viewBio" class="bio-text">-</p>

        <!-- Çalışır Durumda Canlı Canlı Müzik Oynatıcı -->
        <div id="musicModule" class="audio-player-box" style="display:none;">
            <button class="play-btn" onclick="toggleMusic()"><i id="playIcon" class="fa-solid fa-play"></i></button>
            <div style="text-align:left;">
                <span id="musicTitle" style="font-weight:700; font-size:0.9rem; display:block;">Fon Müziği</span>
                <span style="font-size:0.75rem; opacity:0.5;">Profil Parçası (Canlı Medya)</span>
            </div>
            <audio id="bgAudio" loop></audio>
        </div>
        
        <!-- Dinamik Link Grubu -->
        <div id="linksWrapper" class="links-group"></div>
    </div>

    <!-- Video Popup Katmanı -->
    <div id="videoModal" class="video-modal">
        <span class="close-video" onclick="closeVideo()"><i class="fa-solid fa-xmark"></i></span>
        <div class="video-box" id="videoBox"></div>
    </div>

    <!-- Çekirdek Sistem Entegrasyonu -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
