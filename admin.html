<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPF.ONE | Yönetim Masası</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body style="justify-content: center; align-items: center; background-image: none;">

    <!-- PANEL GİRİŞ SİSTEMİ -->
    <div id="loginView" class="admin-box" style="max-width:380px; text-align:center;">
        <h2 style="margin-bottom:20px; font-weight:800;">🔐 Panel Girişi</h2>
        <div class="form-group">
            <input type="password" id="authPass" placeholder="Giriş Şifrenizi Yazın (admin)" style="text-align:center;">
        </div>
        <button class="btn-action" onclick="verifyAdmin()">Giriş Yap</button>
    </div>

    <!-- TÜM SİSTEMİN DÜZENLENDİĞİ ANA ALAN -->
    <div id="editScreen" class="admin-box" style="display: none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #1f2937; padding-bottom:15px;">
            <h2 style="font-weight:800; font-size:1.2rem;">⚙️ Sistem Kontrol Odası</h2>
            <button class="btn-action btn-del" style="width:auto; margin:0; padding:6px 12px;" onclick="location.reload()">Çıkış</button>
        </div>

        <h3 class="panel-section-title">🏅 PROFİL ROZETLERİ (AÇ/KAPAT)</h3>
        <div class="checkbox-grid">
            <div class="checkbox-item"><input type="checkbox" id="badgeVerified"><label for="badgeVerified">✅ Onaylı</label></div>
            <div class="checkbox-item"><input type="checkbox" id="badgePremium"><label for="badgePremium">👑 Premium</label></div>
            <div class="checkbox-item"><input type="checkbox" id="badgeDeveloper"><label for="badgeDeveloper">💻 Kodcu</label></div>
            <div class="checkbox-item"><input type="checkbox" id="badgeVip"><label for="badgeVip">💎 VIP</label></div>
        </div>

        <h3 class="panel-section-title">👤 METİN GİRİŞLERİ VE GÖRSELLER</h3>
        <div class="form-group"><label>Profil İsmi (Metin)</label><input type="text" id="inputName"></div>
        <div class="form-group"><label>Biyografi Tanıtımı (Metin)</label><textarea id="inputBio" rows="2"></textarea></div>
        <div class="form-group"><label>Profil Fotoğrafı Adresi (URL)</label><input type="text" id="inputAvatar"></div>
        
        <h3 class="panel-section-title">🎨 RENK TEMASI (HEX KODLARI)</h3>
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
            <div class="form-group"><label>Arka Plan</label><input type="text" id="inputBg"></div>
            <div class="form-group"><label>Buton Rengi</label><input type="text" id="inputCardBg"></div>
            <div class="form-group"><label>Yazı Rengi</label><input type="text" id="inputTextColor"></div>
        </div>

        <h3 class="panel-section-title">🎵 FON MÜZİĞİ MODÜLÜ</h3>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <div class="form-group"><label>Şarkı İsmi (Metin)</label><input type="text" id="inputMusicTitle"></div>
            <div class="form-group"><label>Ses Adresi (.mp3 URL)</label><input type="text" id="inputMusicUrl"></div>
        </div>

        <h3 class="panel-section-title">🔗 SOSYAL MEDYA VE POPUP VİDEO EKLEME MOTORU</h3>
        <div style="background: #030712; padding: 14px; border-radius: 12px; border: 1px solid #1f2937; margin-bottom: 15px;">
            <div class="form-group"><label>Buton Metni</label><input type="text" id="newLinkTitle" placeholder="Metin yazın"></div>
            <div class="form-group"><label>Yönlendirilecek Adres (URL)</label><input type="text" id="newLinkUrl" placeholder="https://..."></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                <div class="form-group">
                    <label>Platform İkonu</label>
                    <select id="newLinkIcon">
                        <option value="fa-brands fa-instagram">Instagram 📸</option>
                        <option value="fa-brands fa-tiktok">TikTok 🎵</option>
                        <option value="fa-brands fa-youtube">YouTube 📺</option>
                        <option value="fa-solid fa-link">Özel Adres URL 🔗</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Çalışma Biçimi</label>
                    <select id="newLinkType">
                        <option value="normal">Yeni Sekmede Aç</option>
                        <option value="video">Site İçinden Oynat (Popup)</option>
                    </select>
                </div>
            </div>
            <button class="btn-action" style="background:#3b82f6; margin-top:10px;" onclick="insertLink()">Havuzuna Enjekte Et</button>
        </div>
        
        <div id="adminLinksView"></div>

        <h3 class="panel-section-title">☁️ KALICILIK İÇİN GİTHUB BULUT DEPO BAĞLANTISI</h3>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom:10px;">
            <div class="form-group"><label>GitHub Kullanıcı Adı</label><input type="text" id="inputGhUser"></div>
            <div class="form-group"><label>Depo (Repo) Adı</label><input type="text" id="inputGhRepo"></div>
        </div>
        <div class="form-group">
            <label>GitHub Personal Access Token (PAT)</label>
            <input type="password" id="inputGhToken" placeholder="ghp_ ile başlayan anahtarınız">
        </div>
        
        <button class="btn-action btn-save-all" onclick="commitAndPushToGithub()">💾 Tüm Özellikleri Kaydet ve GitHub'a Pushla</button>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
